#
# Thank you for using Narrator!
# Here is an example of chapter file setting,
# These are the features you can use below:
#
#   T/TITLE:
#       --Feature:
#           send a title to player
#           in, keep, out must be int, they are ticks
#       --Form: T/TITLE|in|keep|out|TEXT|SUBTEXT
#
#   M/MESSAGE:
#       --Feature:
#           send a message to player's chat
#           TEXT supported ChatColor
#       --Form: M/MESSAGE|TEXT
#
#   MC/MESSAGE_CLICK:
#       --Feature:
#           send a message to player's chat
#           when they swing right arm then show next
#           TEXT supported ChatColor
#       --Form: MC/MESSAGE_CLICK|TEXT
#
#   MD/MESSAGE_DROP:
#       --Feature:
#           send a message to player's chat
#           when they drop item then show next
#           TEXT supported ChatColor
#       --Form: MD/MESSAGE_DROP|TEXT
#
#   AB/ACTIONBAR:
#       --Feature:
#           send a message to player's actionbar
#           Time units is ticks
#           TEXT supported ChatColor
#       --Form: AB/ACTIONBAR|isPrint|in|keep|TEXT
#               AB/ACTIONBAR|true|in|keep|TEXT
#               AB/ACTIONBAR|false|TEXT
#
#   D/DELAY:
#       --Feature:
#           delay execute next contents=
#           Time units is ticks (20ticks=1s)
#           you can type 1000 or 1*1000 for 1s
#       --Form: D/DELAY|keep
#
#   C/CONDITION:
#       --Feature:
#           need player finish some condition then can execute next content
#       --Form:
#             a: C/CONDITION|CONDITION1
#             b: C/CONDITION|CONDITION1\CONDITION2
#             c: C/CONDITION|CONDITION1\\CONDITION2
#             d: C/CONDITION|CONDITION1&CONDITION2
#             e: C/CONDITION|CONDITION1&&CONDITION2
#
#         CONDITION can be:
#             NPC - touch NPC
#             MOVE - appoint move to any location
#             INTERACT - touch something
#             KILL - need to kill appoint entity
#
#         \ means if one of two conditions be false then execute
#         \\ means two conditions need to be false
#         & means if one of two conditions be true then execute
#         && means two conditions need to be true
#
#   COMMAND:
#       --Feature:
#           execute a command
#       --Form: COMMAND|TEXT
#
#   JT/JUMP_TASK:
#       --Feature:
#           jump to another task
#       --Form: JT/JUMP_TASK|taskOrdinal|contentIndex
#
#   JC/JUMP_CHAPTER:
#       --Feature:
#           jump to another chapter
#       --Form: JC/JUMP_CHAPTER|chapterOrdinal|taskOrdinal|contentIndex
#
#
#   AB_ANSWER/ACTIONBAR_ANSWER:
#       --Feature:
#           更改物品栏进行选择，点击左键确认
#       --Form: AB_ANSWER/ACTIONBAR_ANSWER|MESSAGE|MESSAGE|...|MESSAGE
#
#   TOAST:
#       --Feature:
#           发送自定义成就信息
#           使用<br>作为换行分隔符，每一行字符不应超过 25 个字节
#       --Form: TOAST|GOAL/CHALLENGE/TASK|MATERIAL|MESSAGE
#
# Here is an example how they use in yaml
chapterInfo:
    name: "ChapterExample"
    author: "SakuraTao"
    version: 1.0
    ordinal: 1 # This determines the sequence of the story

chapterTasks:
    Task1: # This can be everything
        name: "Task1"
        ordinal: 1
        content:
            - "T|30|50|30|This is a title|This is a subtitle"
            - "M|This is a test message"
            - "AB|true|5|20|This is a test message"
            - "D|20"
            - "M|This is message will send after 20ticks(1s)"
            - "C|NPC(NpcA)&&NPC(NpcB)"
            - "M|This is message will send after touched NpcA and NpcB"
            - "AB_ANSWER|选择绿宝石|选择钻石"
            - "COMMAND|give SakuraTao diamond"
            - "JT|2|0"
    Task2:
        name: "Task2"
        ordinal: 2
        content:
            - "JC|ChapterExample2"